
apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-deployment
  namespace: webapp

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      shareProcessNamespace: true
      automountServiceAccountToken: false

      initContainers:
        - name: init-done
          image: busybox:1.36
          command: ["sh", "-c", "echo 'init failed'; exit 1"]

      containers:
        - name: nginx
          image: nginx:1.27
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "<h1>hello in MLOPS MENA COMMUNITY : $(date '+%Y-%m-%d %H:%M:%S')</h1>" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3

        - name: time-updater
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                PID="$(pgrep -o nginx || true)"
                if [ -n "$PID" ]; then
                  echo "<h1>hello in MLOPS MENA COMMUNITY : $(date '+%Y-%m-%d %H:%M:%S')</h1>" > "/proc/$PID/root/usr/share/nginx/html/index.html"
                fi
                sleep 5
              done
          securityContext:
            capabilities:
              add:
                - SYS_PTRACE

